<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المخازن والمبيعات</title>
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة المخططات البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f7f6; color: #333; }

        /* شاشة التحميل */
        .loading-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background-color: #2c3e50; color: #fff; position: fixed;
            width: 100%; top: 0; left: 0; z-index: 9999;
        }
        .loader {
            border: 5px solid #34495e; border-top: 5px solid #3498db; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* شاشة تسجيل الدخول */
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; }
        .login-box { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { margin-bottom: 25px; color: #2c3e50; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        
        .btn-primary { width: 100%; padding: 12px; background-color: #3498db; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .btn-danger:hover { background-color: #c0392b; }

        /* لوحة التحكم الأساسية */
        .dashboard-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background-color: #2c3e50; color: #fff; display: flex; flex-direction: column; transition: all 0.3s; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #34495e; }
        .nav-links { list-style: none; padding-top: 20px; flex: 1; }
        .nav-links li a { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; font-size: 16px; transition: 0.3s; }
        .nav-links li a i { margin-left: 10px; width: 20px; text-align: center; }
        .nav-links li a:hover, .nav-links li.active a { background-color: #34495e; color: #fff; border-right: 4px solid #3498db; }
        .logout-link { margin-top: auto; border-top: 1px solid #34495e; }
        .logout-link a { color: #e74c3c !important; }

        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: #fff; padding: 15px 30px; display: flex; justify-content: flex-end; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-info { font-weight: 600; color: #2c3e50; }
        .user-info i { margin-left: 8px; font-size: 20px; vertical-align: middle; }
        
        .content-area { padding: 30px; flex: 1; }

        /* الأقسام الداخلية (SPA) */
        .dashboard-section-content { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* الإحصائيات والمخططات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-card h4 { margin-bottom: 15px; color: #7f8c8d; font-size: 16px; }
        .card-values { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; }
        .text-green { color: #2ecc71; } .text-red { color: #e74c3c; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .chart-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-box h3 { margin-bottom: 15px; color: #2c3e50; font-size: 16px; }

        /* الجداول (للمنتجات وغيرها) */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .table-container { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #ddd; }
        .data-table th { background-color: #f8f9fa; color: #2c3e50; font-weight: 700; }
        .data-table tr:hover { background-color: #f1f2f6; }
